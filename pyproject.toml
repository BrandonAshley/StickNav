[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sticknav"
version = "0.1.0"
description = "A lightweight Windows controller-to-mouse and keyboard utility."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StickNav contributors" }]
dependencies = [
  "pygame>=2.5.0",
  "pynput>=1.7.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
